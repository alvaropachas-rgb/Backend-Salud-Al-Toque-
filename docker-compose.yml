
    #ports:
     # - "5434:5432"
services:

  postgres:
    image: postgres:16-alpine
    container_name: sss001-db

    ports:
      - "${DB_PORT:-5434}:5432"

    environment:
      POSTGRES_DB: ${DB_NAME:-sss001}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: